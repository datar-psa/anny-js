version: '3'

vars:
  PKG_NAME: anny-js
  FIREBASE_PROJECT: clad-main   # anny-js.clad.you lives under the clad Firebase project

tasks:

  # ── Development ────────────────────────────────────────────────────────────

  build:
    desc: Compile TypeScript → dist/ (library)
    cmds:
      - bunx tsc
    sources: [src/**/*.ts, tsconfig.json]
    generates: [dist/**/*.js]

  build:demo:
    desc: Build the demo site → dist-demo/
    cmds: [bunx vite build]

  dev:
    desc: Watch-mode TypeScript compilation (library)
    cmds: [bunx tsc --watch]

  check:
    desc: Type-check everything (src + demo + tests + tools)
    cmds: [bunx tsc --noEmit -p tsconfig.check.json]

  test:
    desc: Run unit + parity tests (fast, no browser)
    cmds: [bun test]

  assets:
    desc: Download MediaPipe models + MediaPipe's test photos into .cache/ (idempotent)
    cmds: [bun tools/fetch_assets.ts]

  test:browser:
    desc: "Headless Chromium regression gates: real MediaPipe on synthetic hands, photos, demo clips (~1 min)"
    deps: [assets]
    env:
      ANNY_BROWSER: "1"
    cmds: [bun test tests/browser]

  validate:
    desc: "Round trip (image → MediaPipe → Anny → render → MediaPipe) + synthetic ground truth; HTML reports in .cache/"
    deps: [assets]
    cmds:
      - bun tools/synthetic.ts --random 60
      - bun tools/roundtrip.ts --set all --frames 12

  naturalness:
    desc: "How natural driven hands are: validate the metrics on labelled poses, then score the demo clips (needs `task sequences` once)"
    cmds:
      - bun tools/naturalness.ts validate
      - bun tools/naturalness.ts sequences

  sequences:
    desc: Cache MediaPipe's detections on every frame of the demo clips → .cache/sequences/ (~3 min)
    deps: [assets]
    cmds: [bun tools/capture_sequences.ts]

  hand-model:
    desc: "Refit the natural-hand prior + MediaPipe noise model: render ground-truth hands at several sizes, measure real-footage noise, emit src/mediapipe/hand-prior.ts (~10 min)"
    deps: [assets]
    cmds:
      - bun tools/hand_dataset.ts
      - bun tools/hand_tta.ts
      - bun tools/hand_trust.ts --emit

  clean:
    desc: Remove build output
    cmds: [rm -rf dist/ dist-demo/]

  demo:
    desc: Serve demos via Vite dev server at http://localhost:3000 (HMR enabled; add ?mp=local to load MediaPipe from node_modules + .cache)
    cmds: [bunx vite]

  fixtures:
    desc: "Regenerate Python-anny parity fixtures (needs body-tuning venv active)"
    cmds:
      - python tools/gen_parity_fixtures.py

  # ── Versioning (package.json as single source of truth) ────────────────────

  bump:
    desc: "Bump version in package.json and tag. BUMP=patch|minor|major (default: patch)"
    vars:
      BUMP: '{{default "patch" .BUMP}}'
    cmds:
      - |
        current=$(node -p "require('./package.json').version")
        IFS='.' read -r major minor patch <<< "$current"
        case "{{.BUMP}}" in
          major) major=$((major + 1)); minor=0; patch=0 ;;
          minor) minor=$((minor + 1)); patch=0 ;;
          patch) patch=$((patch + 1)) ;;
          *) echo "Error: BUMP must be patch|minor|major" >&2; exit 1 ;;
        esac
        new="${major}.${minor}.${patch}"
        tag="{{.PKG_NAME}}/v${new}"

        if git rev-parse "$tag" >/dev/null 2>&1; then
          echo "Error: tag $tag already exists. Tags are immutable." >&2; exit 1
        fi

        # Update package.json version in-place
        node -e "
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          p.version = '${new}';
          fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
        "

        git add package.json
        git commit -m "chore: bump {{.PKG_NAME}} to ${new}"
        git tag "$tag"
        echo "Bumped {{.PKG_NAME}}: ${current} → ${new}  (tag: ${tag})"

  # ── Internal tasks ──────────────────────────────────────────────────────────

  _check-clean:
    internal: true
    cmds:
      - |
        UNSTAGED=$(git diff --name-only -- "{{.TASKFILE_DIR}}")
        STAGED=$(git diff --cached --name-only -- "{{.TASKFILE_DIR}}")
        if [ -n "$UNSTAGED" ] || [ -n "$STAGED" ]; then
          echo "Error: uncommitted changes — the git tag would not match what is shipped." >&2
          [ -n "$STAGED"   ] && echo "  Staged:$(echo "$STAGED" | sed 's/^/\n    /')" >&2
          [ -n "$UNSTAGED" ] && echo "  Unstaged:$(echo "$UNSTAGED" | sed 's/^/\n    /')" >&2
          echo "Commit or stash changes, then retry." >&2
          exit 1
        fi

  _build:
    internal: true
    deps: [check, test]
    cmds:
      - rm -rf dist/
      - bunx tsc

  _on-main:
    internal: true
    cmds:
      - |
        branch=$(git rev-parse --abbrev-ref HEAD)
        [ "$branch" = "main" ] || { echo "Error: release from main (on '$branch')." >&2; exit 1; }
        git fetch -q origin main
        [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ] \
          || { echo "Error: main is not in sync with origin/main — pull/push first." >&2; exit 1; }

  # ── Ship (the one command to rule them all) ─────────────────────────────────

  ship:
    desc: "main only: check-clean → bump + tag → check/test/build → push. CI then publishes to npm (trusted publishing) and creates the GitHub release. BUMP=patch|minor|major (default: patch)"
    vars:
      BUMP: '{{default "patch" .BUMP}}'
    cmds:
      - task: _on-main
      - task: _check-clean
      - task: bump
        vars: {BUMP: "{{.BUMP}}"}
      - task: _build
      - |
          version=$(node -p "require('./package.json').version")
          tag="{{.PKG_NAME}}/v${version}"
          git push origin HEAD "$tag"
          echo ""
          echo "Tagged {{.PKG_NAME}}@${version} — CI (release job) publishes it:"
          echo "  run:        https://github.com/datar-psa/anny-js/actions"
          echo "  npm:        https://www.npmjs.com/package/{{.PKG_NAME}}"
          echo "  jsDelivr:   https://cdn.jsdelivr.net/npm/{{.PKG_NAME}}@${version}/dist/index.js"

  # ── Firebase Hosting (demo pages) ──────────────────────────────────────────

  deploy:
    desc: "Manual (break-glass) deploy to anny-js.clad.you. Normally CI deploys main; every branch gets a preview."
    deps: [build, "build:demo"]
    cmds:
      - bunx firebase deploy --only hosting:{{.PKG_NAME}} --project {{.FIREBASE_PROJECT}}

  deploy:init:
    desc: "First-time setup — create anny-js site under clad-main, wire custom domain"
    cmds:
      - bunx firebase hosting:sites:create {{.PKG_NAME}} --project {{.FIREBASE_PROJECT}} || true
      - |
        echo ""
        echo "DNS record (add to clad.you zone):"
        echo "  CNAME  anny-js.clad.you  →  anny-js.web.app"
        echo ""
        echo "Then in Firebase console → Hosting → anny-js site → Add custom domain:"
        echo "  anny-js.clad.you"
